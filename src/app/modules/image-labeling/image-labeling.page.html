<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home"></ion-back-button>
    </ion-buttons>
    <ion-title>ML Kit Image Labeling</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-header>
      <ion-card-title>About</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      ⚡️ Capacitor plugin for ML Kit Image Labeling.
    </ion-card-content>
    <ion-row class="ion-no-padding">
      <ion-col>
        <ion-button
          fill="clear"
          (click)="openOnGithub()"
          class="ion-float-right"
          >GitHub</ion-button
        >
      </ion-col>
    </ion-row>
  </ion-card>
  <ion-card>
    <ion-card-header>
      <ion-card-title>Demo</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <form [formGroup]="formGroup">
        <ion-item>
          <ion-label position="fixed">Confidence Threshold</ion-label>
          <ion-range
            aria-label="Confidence Threshold"
            [ticks]="true"
            [snaps]="true"
            [min]="0"
            [max]="10"
            [pin]="true"
            [pinFormatter]="pinFormatter"
            formControlName="confidenceThreshold"
          ></ion-range>
        </ion-item>
        <ion-button (click)="processImage()">Process Image</ion-button>
      </form>
    </ion-card-content>
  </ion-card>
  @for (label of labels; track label; let i = $index) {
  <ion-card>
    <ion-card-header>
      <ion-card-title>Label #{{ i + 1 }}</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="fixed">Text</ion-label>
        <ion-input type="text" readonly [value]="label.text"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="fixed">Index</ion-label>
        <ion-input type="text" readonly [value]="label.index"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="fixed">Confidence</ion-label>
        <ion-input type="text" readonly [value]="label.confidence"></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>
  }
</ion-content>
